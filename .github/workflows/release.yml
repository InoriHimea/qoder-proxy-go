name: CI/CD

on:
  push:
    branches: [ "go-rewrite", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[skip]') && !contains(github.event.head_commit.message, '[nobump]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: bump
        name: Bump Version
        run: |
          # Compare versions from HEAD~1 (before this commit) vs HEAD (current)
          OLD_VERSION=$(git show HEAD~1:main.go 2>/dev/null | grep -oP 'serverVersion\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          NEW_VERSION=$(grep -oP 'serverVersion\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' main.go)

          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION). Bumping patch."
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            sed -i "s/serverVersion = \".*\"/serverVersion = \"${NEW_VERSION}\"/" main.go
            sed -i "s/${OLD_VERSION}/${NEW_VERSION}/g" dashboard.go
            echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            # Auto-bumped — commit and tag
            git add main.go dashboard.go
            git commit -m "ci: auto bump to ${NEW_VERSION} [nobump]"
            git tag "v${NEW_VERSION}"
            git push origin HEAD --follow-tags
          else
            echo "Version already bumped: ${OLD_VERSION} → ${NEW_VERSION}"
            echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            # Manually bumped — tag the current commit (skip if tag already exists)
            git tag "v${NEW_VERSION}" 2>/dev/null || echo "Tag v${NEW_VERSION} already exists, skipping"
            git push origin "v${NEW_VERSION}" 2>/dev/null || echo "Tag already pushed"
          fi

      - name: Commit & Tag
        if: "steps.bump.outputs.new_version != ''"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OLD_VERSION=$(git show HEAD:main.go | grep -oP 'serverVersion\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+')
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            git add main.go dashboard.go
            git commit -m "chore: bump version to ${NEW_VERSION} [nobump]"
            git tag "v${NEW_VERSION}"
            git push origin HEAD --follow-tags
          else
            # Tag current commit if not already tagged
            if ! git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
              git tag "v${NEW_VERSION}"
              git push origin "v${NEW_VERSION}"
            fi
          fi

  docker:
    name: Build & Push Docker Image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "refs/tags/v${{ needs.version.outputs.new_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build & Release Binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "refs/tags/v${{ needs.version.outputs.new_version }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o qoder-proxy-linux-amd64 .

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o qoder-proxy-linux-arm64 .

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o qoder-proxy-windows-amd64.exe .

      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -o qoder-proxy-darwin-amd64 .

      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o qoder-proxy-darwin-arm64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.new_version }}"
          files: |
            qoder-proxy-linux-amd64
            qoder-proxy-linux-arm64
            qoder-proxy-windows-amd64.exe
            qoder-proxy-darwin-amd64
            qoder-proxy-darwin-arm64
          generate_release_notes: true
