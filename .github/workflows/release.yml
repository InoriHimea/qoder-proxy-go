name: CI/CD

on:
  push:
    branches: [ "go-rewrite", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Read & Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: version
        name: Resolve Version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          CURRENT=$(grep -oP 'serverVersion\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' main.go)

          # [nobump] or [skip]: skip the bump, but still output the current version for docker/release
          if echo "$COMMIT_MSG" | grep -qE '\[nobump\]|\[skip\]'; then
            echo "Skipping bump (nobump/skip tag). Current version: $CURRENT"
            echo "new_version=${CURRENT}" >> $GITHUB_OUTPUT
            exit 0
          fi

          OLD=$(git show HEAD~1:main.go 2>/dev/null | grep -oP 'serverVersion\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$OLD" ] || [ "$OLD" = "$CURRENT" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            NEW="${MAJOR}.${MINOR}.${PATCH}"
            sed -i "s/serverVersion = \".*\"/serverVersion = \"${NEW}\"/" main.go
            git add main.go
            git commit -m "ci: auto bump to ${NEW} [nobump]"
            git tag "v${NEW}" 2>/dev/null || true
            git push origin HEAD --follow-tags
            echo "new_version=${NEW}" >> $GITHUB_OUTPUT
          else
            echo "Version manually bumped: ${OLD} → ${CURRENT}"
            git tag "v${CURRENT}" 2>/dev/null || echo "Tag already exists"
            git push origin "v${CURRENT}" 2>/dev/null || echo "Tag already pushed"
            echo "new_version=${CURRENT}" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build & Push Docker Image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "refs/tags/v${{ needs.version.outputs.new_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build & Release Binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "refs/tags/v${{ needs.version.outputs.new_version }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o qoder-proxy-linux-amd64 .

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o qoder-proxy-linux-arm64 .

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o qoder-proxy-windows-amd64.exe .

      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -o qoder-proxy-darwin-amd64 .

      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o qoder-proxy-darwin-arm64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.new_version }}"
          files: |
            qoder-proxy-linux-amd64
            qoder-proxy-linux-arm64
            qoder-proxy-windows-amd64.exe
            qoder-proxy-darwin-amd64
            qoder-proxy-darwin-arm64
          generate_release_notes: true
